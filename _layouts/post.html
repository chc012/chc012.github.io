---
layout: default
---
<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>

  {% if page.image %}
  <figure class="post-figure">
    <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | escape }}">
    {% if page.image_caption %}
    <figcaption>{{ page.image_caption | markdownify | remove: '<p>' | remove: '</p>' | strip }}</figcaption>
    {% endif %}
  </figure>
  {% endif %}

  <div class="post-body">
    {{ content }}
  </div>
</article>

<footer class="post-footer">
  <a href="{{ '/thoughts/' | relative_url }}">&larr; All thoughts</a>
</footer>
